# Anomalous AWS sts:AssumeRole patterns in CloudTrail.
#
# Two documents in this file:
#   1. Base detection: any sts:AssumeRole event (named for correlation)
#   2. Correlation rule: principal assuming 5 or more distinct roles in 10 min

title: AWS STS AssumeRole Event
id: ad34faae-bd56-4c6b-8685-9bb617b4a742
name: aws_sts_assumerole
status: experimental
description: Base event for any AWS STS AssumeRole API call. Used by correlation rules.
references:
  - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
  - https://attack.mitre.org/techniques/T1078/004/
author: Cameron Hopkin
date: 2026/05/27
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_assumerole:
    eventSource: 'sts.amazonaws.com'
    eventName: 'AssumeRole'
  filter_errors:
    errorCode:
      - 'AccessDenied'
      - 'InvalidParameterValue'
  condition: selection_assumerole and not filter_errors
fields:
  - userIdentity.principalId
  - userIdentity.arn
  - userIdentity.userName
  - requestParameters.roleArn
  - sourceIPAddress
  - userAgent
falsepositives:
  - Base rule, not actionable on its own.
level: informational

---

title: AWS Principal Assumes Multiple Distinct Roles in Short Window
id: 99018bfd-c126-4d00-91de-80f2c4875b9a
status: experimental
description: |
  A single AWS principal (IAM user, role, or federated identity) successfully
  assumes 5 or more distinct IAM roles within a 10-minute window. Consistent
  with role-chaining for privilege escalation, automated reconnaissance after
  credential compromise, or pivoting through a misconfigured trust chain.

  Legitimate operations (CI/CD pipelines, cross-account workflows) tend to
  show consistent role-assumption patterns; this rule is tuned for
  unexpected breadth, not depth.
references:
  - https://attack.mitre.org/techniques/T1078/004/
  - https://attack.mitre.org/techniques/T1550/
  - https://www.mandiant.com/resources/blog/lapsus-extortion  # role chaining post-compromise
author: Cameron Hopkin
date: 2026/05/27
correlation:
  type: value_count
  rules:
    - aws_sts_assumerole
  group-by:
    - userIdentity.arn
  timespan: 10m
  condition:
    field: requestParameters.roleArn
    distinct_count_gte: 5
tags:
  - attack.privilege_escalation
  - attack.t1078.004
  - attack.lateral_movement
  - attack.t1550
falsepositives:
  - Engineering principal during a deploy or break-glass that touches multiple environment roles - identify the principal ARN and exclude, or scope to non-deploy hours
  - Automated cross-account orchestration (Terraform, AWS Step Functions, CodePipeline) - exclude the service-linked role ARN
  - Security audit tooling (Prowler, ScoutSuite, custom auditors) running with broad list-roles + assume-role permissions - allow-list the audit principal
  - Incident response playbook execution that legitimately fans out across accounts - exclude IR principals during active incidents (tracked separately)
level: high
